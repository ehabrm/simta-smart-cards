# STAGING configuration (separate Worker + D1, not production).
# Replace the placeholders with the real values from the Cloudflare dashboard
# BEFORE deploying, and review with the owner first.
name = "simta-cards-staging-v2"
main = "src/index.js"
compatibility_date = "2024-11-01"

[vars]
ENVIRONMENT = "staging"
# Comma-separated list of exact origins allowed to call the API (no wildcard).
ALLOWED_ORIGINS = "https://simta-admin-upgrade.simta-smart-cards.pages.dev"
CARD_BASE_URL = "https://simta-admin-upgrade.simta-smart-cards.pages.dev/card.html"

[[d1_databases]]
binding = "DB"
database_name = "simta-cards-staging-db"
database_id = "c8f066ad-d564-4562-8aa0-eebaccaff168"
migrations_dir = "migrations"

# Secrets (never put in this file):
#   wrangler secret put SETUP_TOKEN    # one-time token used to create the first admin
