<style>
:root{--bg:#01081b;--bg2:#06122d;--card:#0a1a3d;--card2:#0d2150;--line:#16306a;--ink:#eaf1ff;--muted:#a9b9da;--cy:#19b8ff;--bl:#2f6bff;--violet:#7a5cff;--ok:#5fd39a;--bad:#ff7a70;--gold:#d9a94f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#0b2260 0%,transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic","Noto Sans Arabic",-apple-system,BlinkMacSystemFont,Arial,sans-serif;font-size:15px;line-height:1.6;min-height:100vh}
button,input,select{font:inherit;color:inherit}
.hidden{display:none!important}
.topbar{position:sticky;top:0;z-index:20;background:rgba(3,12,36,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 18px}
.topbar:before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--violet),var(--bl),var(--cy))}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.topbar img.logo{height:38px;width:auto;border-radius:9px;display:block}
.brand b{font-size:17px;letter-spacing:1.5px;font-weight:800;direction:ltr}
.brand b i{font-style:normal;color:var(--cy)}
.brand small{display:block;font-size:11px;color:var(--muted);letter-spacing:.5px;font-weight:600;direction:ltr;margin-top:-4px}
.topbar .sp{flex:1}
.pill{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 14px;color:var(--ink);font-weight:600;font-size:13px;cursor:pointer;transition:border-color .15s,background .15s}
.pill{white-space:nowrap}
input[type=checkbox]{accent-color:var(--cy)}
.pill:hover{border-color:var(--cy);background:var(--card2)}
select.pill{appearance:none;-webkit-appearance:none;min-height:0;width:auto;padding:6px 14px;border-radius:20px}
select.pill option{background:var(--card);color:var(--ink)}
.who{font-size:13px;color:var(--muted);direction:ltr;unicode-bidi:embed}
.tabs{display:flex;gap:4px;padding:10px 18px 0;overflow-x:auto;background:rgba(3,12,36,.94);border-bottom:1px solid var(--line);position:sticky;top:57px;z-index:19}
.tab{border:0;background:none;padding:10px 14px;border-bottom:3px solid transparent;color:var(--muted);font-weight:600;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{color:#fff;border-image:linear-gradient(90deg,var(--bl),var(--cy)) 1}
main{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
h2{margin:0 0 14px;font-size:20px;color:#fff}
.grid{display:grid;gap:14px}
.stats{grid-template-columns:repeat(2,1fr)}
@media(min-width:760px){.stats{grid-template-columns:repeat(4,1fr)}}
.card{background:linear-gradient(180deg,var(--card),#081634);border:1px solid var(--line);border-radius:16px;padding:16px}
.stat b{display:block;font-size:30px;color:#fff;line-height:1.1}
.stat span{color:var(--muted);font-size:13px}
.two{grid-template-columns:1fr}
@media(min-width:860px){.two{grid-template-columns:1fr 1fr}}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.bar input[type=search]{flex:1;min-width:200px}
input,select{background:#061330;border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;width:100%;color:var(--ink)}
textarea{background:#061330;border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;color:var(--ink);font:inherit}
textarea:focus{outline:2px solid var(--cy);outline-offset:1px}
input::placeholder,textarea::placeholder{color:#7487b3}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--cy);outline-offset:1px}
.bar select{width:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid transparent;background:linear-gradient(135deg,var(--bl),var(--cy));color:#fff;font-weight:700;cursor:pointer;text-shadow:0 1px 2px #0006}
.btn:hover{filter:brightness(1.08)}
.btn.alt{background:var(--card2);color:var(--ink);border-color:var(--line);text-shadow:none}
.btn.danger{background:transparent;color:var(--bad);border-color:#7a3340;text-shadow:none}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
table{width:100%;border-collapse:collapse}
th,td{text-align:start;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);letter-spacing:.4px;background:#071735}
tr:last-child td{border-bottom:0}
.tablewrap{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.emp{display:flex;align-items:center;gap:10px}
.av{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--violet),var(--bl));overflow:hidden;flex:none;display:grid;place-items:center;color:#fff;font-weight:800}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:96px;height:96px;border-radius:24px}
.badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:700}
.badge.on{background:#12382f;color:var(--ok)}.badge.off{background:#44202a;color:var(--bad)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;direction:ltr;unicode-bidi:embed}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.cards-m{display:none}
@media(max-width:760px){.who{display:none}.topbar{padding:10px 12px;gap:6px}.topbar img.logo{height:32px}.brand span{display:none}.pill{padding:6px 10px;font-size:12px}.topbar{flex-wrap:wrap}select.pill{padding:6px 10px}.tabs{top:53px;padding:8px 10px 0}}
html,body{overflow-x:hidden;max-width:100%}
@media(max-width:760px){.tablewrap table{display:none}.tablewrap{background:none;border:0}.cards-m{display:grid;gap:10px}}
.mc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.mc .meta{color:var(--muted);font-size:13px;margin:6px 0 10px}
.login{max-width:420px;margin:7vh auto;padding:0 16px}
.login .card{padding:26px;box-shadow:0 20px 60px #0008}
.login img{display:block;margin:0 auto 16px;width:100%;max-width:300px;border-radius:14px}
.login .sub{text-align:center;color:var(--muted);margin:-6px 0 16px;font-size:14px}
.login .foot{text-align:center;color:#7487b3;font-size:12px;margin-top:16px;direction:ltr}
label{display:block;font-size:13px;color:var(--muted);margin:0 0 4px}
.f{margin-bottom:12px}
.err{background:#44202a;color:#ffb3ac;border-radius:10px;padding:8px 12px;margin:0 0 12px;font-size:14px}
.fe{color:var(--bad);font-size:12px;margin-top:3px}
.modal{position:fixed;inset:0;background:#01081bcc;z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:760px){.modal{align-items:center}}
.sheet{background:var(--card);border:1px solid var(--line);width:100%;max-width:760px;max-height:94vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px}
@media(min-width:760px){.sheet{border-radius:20px}}
.sheet h3{margin:0 0 14px;color:#fff}
.fgrid{display:grid;gap:0 12px;grid-template-columns:1fr}
@media(min-width:620px){.fgrid{grid-template-columns:1fr 1fr}}
.photo-row{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.sheet .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
.preview{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:760px){.preview{grid-template-columns:auto 1fr}}
.preview iframe{width:100%;max-width:390px;height:640px;border:1px solid var(--line);border-radius:18px;background:#fff;margin:0 auto}
.qrbox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;display:inline-block;line-height:0}
.qrbox svg{width:220px;height:220px}
.urlrow{display:flex;gap:8px;margin:10px 0}
.urlrow input{direction:ltr;text-align:left}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#eaf1ff;color:#01081b;font-weight:600;padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99}
.toast.on{opacity:1}
.deptbar{display:flex;align-items:center;gap:10px;margin:8px 0}
.deptbar i{display:block;height:10px;border-radius:6px;background:linear-gradient(90deg,var(--bl),var(--cy))}
.muted{color:var(--muted)}
.empty{padding:30px;text-align:center;color:var(--muted)}
.audit td{font-size:13px}

/* ---- app shell (sidebar layout) ---- */
.layout{display:grid;grid-template-columns:248px minmax(0,1fr);align-items:start}
.side{position:sticky;top:57px;height:calc(100vh - 57px);overflow:auto;padding:16px 12px;background:rgba(3,12,36,.6);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
#nav{display:flex;flex-direction:column;gap:4px}
.tab{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:11px 12px;border-radius:12px;color:var(--muted);font-weight:600;cursor:pointer;text-align:start;min-height:44px}
.tab svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab:hover{color:var(--ink);background:#0a1a3d}
.tab[aria-selected=true]{color:#fff;background:linear-gradient(135deg,#143a8f,#0e5a95);box-shadow:inset 0 0 0 1px #2a56b8}
.sidefoot{margin-top:auto;padding:12px;font-size:12px;color:#7487b3;direction:ltr;text-align:center}
.layout>main{margin:0 auto;width:100%;max-width:1240px}
.badge:empty{display:none}
.menubtn,.scrim{display:none}
@media(max-width:900px){
 .layout{display:block}
 .menubtn{display:inline-block;padding:6px 12px;font-size:16px;line-height:1}
 .side{position:fixed;z-index:40;top:0;height:100vh;width:268px;inset-inline-start:0;background:#040f2b;transition:transform .2s;padding-top:20px}
 [dir=rtl] .side{transform:translateX(100%)}[dir=ltr] .side{transform:translateX(-100%)}
 .side.open{transform:none!important}
 .scrim{position:fixed;inset:0;background:#01081bb0;z-index:39}.scrim.on{display:block}
}
.page-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 16px}
.page-h h2{margin:0;flex:1;min-width:160px}
.sub{color:var(--muted);font-size:13px}
.stats3{grid-template-columns:repeat(2,1fr)}@media(min-width:760px){.stats3{grid-template-columns:repeat(3,1fr)}}@media(min-width:1100px){.stats3{grid-template-columns:repeat(6,1fr)}}
.stat{position:relative}.stat small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.cogrid{display:grid;gap:14px;grid-template-columns:1fr}@media(min-width:700px){.cogrid{grid-template-columns:1fr 1fr}}@media(min-width:1150px){.cogrid{grid-template-columns:repeat(3,1fr)}}
.co{display:grid;gap:12px;cursor:pointer;transition:border-color .15s,transform .15s;text-align:start;color:inherit;width:100%;font:inherit}
.co:hover{border-color:var(--cy);transform:translateY(-1px)}
.co .top{display:flex;gap:12px;align-items:center}
.logo-b{width:52px;height:52px;border-radius:14px;overflow:hidden;flex:none;display:grid;place-items:center;font-weight:800;color:#fff;font-size:18px;direction:ltr}
.logo-b img{width:100%;height:100%;object-fit:contain;background:#fff}
.logo-b.lg{width:72px;height:72px;border-radius:18px;font-size:24px}
.mini{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px}.mini b{color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.badge.warn{background:#4a3a14;color:var(--gold)}.badge.mute{background:#1b2a52;color:var(--muted)}
.subtabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:0 0 16px}
.subtab{border:0;background:none;padding:10px 14px;border-bottom:3px solid transparent;color:var(--muted);font-weight:600;cursor:pointer;white-space:nowrap;min-height:44px}
.subtab[aria-selected=true]{color:#fff;border-bottom-color:var(--cy)}
.alertrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.alertrow:last-child{border-bottom:0}.alertrow span.t{flex:1;min-width:180px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--gold);flex:none}
.shortcuts{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}@media(min-width:760px){.shortcuts{grid-template-columns:repeat(4,1fr)}}
.shortcuts .btn{justify-content:flex-start}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px;counter-reset:s}
.step{flex:1;min-width:92px;text-align:center;font-size:12px;color:var(--muted);padding:8px 6px;border-radius:10px;background:#071735;border:1px solid var(--line)}
.step.on{color:#fff;border-color:var(--cy);background:#0b2a60}.step.done{color:var(--ok)}
.fgrid2{display:grid;gap:0 14px;grid-template-columns:1fr}@media(min-width:700px){.fgrid2{grid-template-columns:1fr 1fr}}
.brrow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center;margin-bottom:8px}
@media(max-width:620px){.brrow{grid-template-columns:1fr auto}.brrow button{grid-column:2;grid-row:1/3}}
.colorrow{display:flex;gap:10px;align-items:center}.colorrow input[type=color]{width:56px;padding:3px;min-height:44px}
.pv{border:1px solid var(--line);border-radius:22px;overflow:hidden;background:#fff;color:#14213d;max-width:300px;margin:0 auto;box-shadow:0 10px 30px #0006}
.pv .hd{padding:22px 16px 38px;color:#fff;text-align:center}
.pv .lg{width:68px;height:68px;border-radius:18px;margin:0 auto 8px;background:#ffffff30;display:grid;place-items:center;overflow:hidden;font-weight:800;font-size:22px}
.pv .lg img{width:100%;height:100%;object-fit:contain;background:#fff}
.pv .bd{padding:0 16px 18px;margin-top:-22px}
.pv .em{background:#fff;border-radius:16px;box-shadow:0 4px 14px #0002;padding:12px;text-align:center}
.pv .em b{display:block;font-size:15px}.pv .em span{font-size:12px;color:#5a6785}
.pv .bt{display:block;margin:10px 0 0;padding:10px;border-radius:12px;color:#fff;text-align:center;font-weight:700;font-size:13px}
.pv .brs{margin-top:12px;font-size:12px;color:#44506b;text-align:center}
.progress li{list-style:none;padding:6px 0;display:flex;gap:8px}.progress{padding:0;margin:10px 0}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.sw{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.arch li{display:flex;gap:10px;align-items:center;list-style:none;padding:6px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.arch{padding:0;margin:8px 0}
@media(max-width:760px){main{padding:14px 12px 50px}.page-h h2{font-size:18px}}
</style>
